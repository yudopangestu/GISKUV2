[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "private, no-store"
Netlify-CDN-Cache-Control = "no-store"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[redirects]]
from = "/login"
to = "/"
status = 302

[[redirects]]
from = "/login.html"
to = "/"
status = 302
